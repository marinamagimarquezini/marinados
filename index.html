<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarinaAds</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: transparent;
    }
    #ad-link {
      display: block;
      width: 100%;
      height: 100%;
      text-decoration: none;
    }
    #ad-img {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      object-fit: fill;
      transition: opacity 0.3s ease; 
    }
    .sidelink-tag {
      position: absolute;
      bottom: 4px;
      left: 4px;
      background: #d4d0c8;
      color: #000;
      font-size: 11px;
      font-family: 'MS Gothic', Tahoma, sans-serif;
      padding: 1px 4px;
      border: 1px solid #808080;
      border-radius: 2px;
      text-decoration: none;
      box-shadow: 1px 1px 0px #fff inset, 1px 1px 2px rgba(0,0,0,0.5);
      z-index: 10;
    }
    .sidelink-tag:hover {
      background: #ffffff;
      color: #000;
    }
  </style>
</head>
<body>

  <a id="ad-link" href="#" target="_blank" rel="noopener">
    <img id="ad-img" src="" alt="MarinaAds">
  </a>

  <a href="https://marinamagimarquezini.github.io/marinados/" class="sidelink-tag" target="_blank">
    MarinaAds
  </a>

  <script>
    const members = [
      {
        url: "https://marinados.neocities.org",
        banner: "https://raw.githubusercontent.com/marinamagimarquezini/marinados/main/marinados.gif"
      }
      ,{
        url: "",
        banner: "https://raw.githubusercontent.com/marinamagimarquezini/marinados/main/scarycats.gif"
      }
      */
    ];

    let currentIndex = 0;

    function trocarAnuncio() {
      if (members.length === 0) return;

      const img = document.getElementById("ad-img");
      const link = document.getElementById("ad-link");

      img.style.opacity = 0;

      setTimeout(() => {
        currentIndex = (currentIndex + 1) % members.length;
        const currentMember = members[currentIndex];

        link.href = currentMember.url;
        img.src = currentMember.banner;
        img.style.opacity = 1;
      }, 300);
    }
    if (members.length > 0) {
      document.getElementById("ad-link").href = members[0].url;
      document.getElementById("ad-img").src = members[0].banner;
    }

    setInterval(trocarAnuncio, 15000);
  </script>
</body>
</html>
